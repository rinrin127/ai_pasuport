name: Threads 予約投稿

on:
  schedule:
    - cron: "*/15 * * * *"   # 15分おき（GitHub Actionsのcronは数分遅延することあり）
  workflow_dispatch:

concurrency:
  group: threads-scheduler
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Publish due posts
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python threads-automation/src/publish_due.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add threads-automation/queue threads-automation/published
          if ! git diff --cached --quiet; then
            git commit -m "chore(threads): publish scheduled posts [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
