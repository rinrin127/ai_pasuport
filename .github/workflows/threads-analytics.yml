name: Threads 投稿分析

on:
  schedule:
    - cron: "0 22 * * *"   # 毎日 7:00 JST
  workflow_dispatch:

concurrency:
  group: threads-analytics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Analyze posts
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python threads-automation/src/analyze.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add threads-automation/published threads-automation/reports threads-automation/data
          if ! git diff --cached --quiet; then
            git commit -m "chore(threads): daily analytics report [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
